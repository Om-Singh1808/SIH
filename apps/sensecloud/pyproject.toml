[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensecloud"
version = "1.0.0"
description = "RetailSense SenseCloud: multi-store cloud API (ingest, aggregation, alerting, dispatch, fleet, forecasts, reports)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "retailsense-contracts>=1.0.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2,<3",
    "pandas>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff"]
mqtt = ["paho-mqtt>=2"]

[project.scripts]
sensecloud = "sensecloud.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sensecloud*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B006", "UP007"]
