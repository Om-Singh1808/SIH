[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "senseedge"
version = "1.0.0"
description = "SenseEdge: the per-store RetailSense edge process (camera workers, rules, store, sync, local REST/WS/MJPEG API)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "retailsense-contracts",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "websockets>=12",
    "pyyaml>=6",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff"]
cv = ["opencv-python>=4.8"]

[project.scripts]
senseedge = "senseedge.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["senseedge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B006", "UP007"]
