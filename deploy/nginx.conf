# SenseBoard static hosting + same-origin proxies so the dashboard needs no CORS in docker.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routes: /owner /ops /insights /chain /zones
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SenseCloud REST + WS
    location /v1/ {
        proxy_pass http://cloud:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SenseEdge REST, MJPEG preview and WS (prefix stripped)
    location /edge/ {
        proxy_pass http://edge:8001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;   # MJPEG needs streaming
        proxy_read_timeout 3600s;
    }
}
