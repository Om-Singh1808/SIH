# Mosquitto 2.x for the optional MQTT 5 uplink (docker compose --profile broker).
# Anonymous access is intentional for the demo LAN; production adds password_file + TLS.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
max_queued_messages 10000

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
