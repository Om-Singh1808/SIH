[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailsense-forecasting"
version = "1.0.0"
description = "RetailSense cloud forecasting: queue-length (5/10/15/30 min) and daily-footfall gradient-boosting forecasters, Indian festival calendar features, reorder suggestions and rolling MAE evaluation."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "retailsense-contracts",
    "pandas>=2",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4"]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["retailsense_forecasting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
