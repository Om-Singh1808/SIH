[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailsense-contracts"
version = "1.0.0"
description = "RetailSense frozen contracts: pydantic models, enums, Protocols, fakes, DDL, i18n templates and generated schemas shared by every SenseEdge/SenseCloud/SenseBoard component."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RetailSense team" }]
dependencies = [
    "pydantic>=2,<3",
    "numpy>=1.24",
    "pyyaml>=6",
    "sqlalchemy>=2,<3",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "pandas>=2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["retailsense_contracts*"]

[tool.setuptools.package-data]
retailsense_contracts = [
    "examples/*.yaml",
    "examples/*.json",
    "examples/*.csv",
    "schemas/*.json",
    "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B006", "UP007"]
