[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailsense-edgeanalytics"
version = "1.0.0"
description = "RetailSense edge analytics: zone membership with inertia, normative line crossing, dwell samples, occupancy cadence, floor-space heatmap and footfall counters."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["retailsense-contracts", "numpy>=1.24", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["retailsense_edgeanalytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
