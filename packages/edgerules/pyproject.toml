[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailsense-edgerules"
version = "1.0.0"
description = "RetailSense edge rule engine: turns shelf/queue/health/sync observations into bilingual, rupee-quantified alerts with dedupe, hysteresis and ack handling."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RetailSense team" }]
dependencies = [
    "retailsense-contracts>=1.0.0",
    "pydantic>=2,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["retailsense_edgerules*"]

[tool.setuptools.package-data]
retailsense_edgerules = ["rules_default.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B006", "UP007"]
