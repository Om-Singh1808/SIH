[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailsense-integrations"
version = "1.0.0"
description = "RetailSense integrations: Tally ERP (XML client + mock server), stock reconciliation, WhatsApp / Telegram notifiers, ONDC (Beckn) availability publisher and the FastAPI router SenseCloud mounts."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RetailSense team" }]
dependencies = [
    "retailsense-contracts>=1.0.0",
    "pydantic>=2,<3",
    "httpx>=0.27",
    "fastapi>=0.110",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff", "uvicorn"]
serve = ["uvicorn"]

[tool.setuptools.packages.find]
where = ["."]
include = ["retailsense_integrations*"]

[tool.setuptools.package-data]
retailsense_integrations = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
