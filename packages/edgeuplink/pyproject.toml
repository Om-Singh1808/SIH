[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailsense-edgeuplink"
version = "1.0.0"
description = "RetailSense edge uplink: HTTP/MQTT store-and-forward sync worker with replay stats, backoff, heartbeat batches and command dispatch."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["retailsense-contracts>=1.0.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx", "ruff"]
mqtt = ["paho-mqtt>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["retailsense_edgeuplink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B006", "UP007"]
