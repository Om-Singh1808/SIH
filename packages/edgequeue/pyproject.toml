[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailsense-edgequeue"
version = "1.0.0"
description = "RetailSense edge queue analytics: join/served/abandoned accounting, Little's-Law wait estimate and short-horizon trend forecast."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["retailsense-contracts>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["retailsense_edgequeue*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "B006", "UP007"]
